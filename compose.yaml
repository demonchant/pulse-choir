services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env.pulse-choir
        required: false
    environment:
      NODE_ENV: development
      PORT: 3000
      DATA_DIR: /data
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - pulse-choir-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    restart: "no"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    depends_on:
      web:
        condition: service_healthy
    init: true
    shm_size: 1gb
    environment:
      PLAYWRIGHT_BASE_URL: http://web:3000
      PLAYWRIGHT_ARTIFACTS: /artifacts
    volumes:
      - ./artifacts:/artifacts
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    profiles: ["test"]
    restart: "no"

volumes:
  pulse-choir-data:
